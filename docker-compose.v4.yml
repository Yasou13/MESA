name: mesa-v4

x-mesa-v4-runtime: &mesa-v4-runtime
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: ${MESA_V4_IMAGE:-mesa-memory:0.9.0}
  restart: "on-failure:5"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  volumes:
    - mesa-v4-data:/var/lib/mesa
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"
  environment:
    MESA_API_KEY: ${MESA_API_KEY:-}
    MESA_PRINCIPAL_ID: ${MESA_PRINCIPAL_ID:-}
    MESA_PRINCIPAL_TYPE: SERVICE
    MESA_PRINCIPAL_STATUS: active
    MESA_STORAGE_ROOT: /var/lib/mesa/data
    MESA_HOME: /var/lib/mesa
    MESA_RUNTIME_PROFILE: combined
    MESA_LOAD_DOTENV: "false"
    MESA_MODEL_ENABLED: ${MESA_MODEL_ENABLED:-false}
    MESA_EMBEDDING_ENABLED: ${MESA_EMBEDDING_ENABLED:-${MESA_MODEL_ENABLED:-false}}
    MESA_EXTRACTION_ENABLED: ${MESA_EXTRACTION_ENABLED:-${MESA_MODEL_ENABLED:-false}}
    MESA_GRAPH_ENABLED: ${MESA_GRAPH_ENABLED:-true}
    MESA_EXTERNAL_PROVIDER_ENABLED: ${MESA_EXTERNAL_PROVIDER_ENABLED:-false}
    MESA_LLM_MODEL: ${MESA_LLM_MODEL:-}
    MESA_LLM_BASE_URL: ${MESA_LLM_BASE_URL:-}
    MESA_LLM_API_KEY: ${MESA_LLM_API_KEY:-}
    MESA_LLM_TIMEOUT_SECONDS: ${MESA_LLM_TIMEOUT_SECONDS:-60}
    MESA_EMBEDDING_MODEL: ${MESA_EMBEDDING_MODEL:-local:magibu/embeddingmagibu-200m}
    # Pass through only if set on the host; otherwise probe at startup.
    MESA_EMBEDDING_DIMENSION:
    MESA_EMBEDDING_VERSION: ${MESA_EMBEDDING_VERSION:-v1}
    MESA_EMBEDDING_MODEL_REVISION: ${MESA_EMBEDDING_MODEL_REVISION:-}
    MESA_EMBEDDING_NORMALIZED: ${MESA_EMBEDDING_NORMALIZED:-true}
    MESA_EMBEDDING_BASE_URL: ${MESA_EMBEDDING_BASE_URL:-}
    MESA_EMBEDDING_API_KEY: ${MESA_EMBEDDING_API_KEY:-}
    MESA_EXTRACTION_THINKING: ${MESA_EXTRACTION_THINKING:-false}
    MESA_EXTRACTION_MAX_TOKENS: ${MESA_EXTRACTION_MAX_TOKENS:-4096}
    MESA_EXTRACTION_LANG: ${MESA_EXTRACTION_LANG:-tr}
    MESA_TIER3_MODE: ${MESA_TIER3_MODE:-}
    MESA_TIER3_LLM_PROVIDER_A: ${MESA_TIER3_LLM_PROVIDER_A:-}
    MESA_TIER3_LLM_MODEL_A: ${MESA_TIER3_LLM_MODEL_A:-}
    MESA_TIER3_LLM_PROVIDER_B: ${MESA_TIER3_LLM_PROVIDER_B:-}
    MESA_TIER3_LLM_MODEL_B: ${MESA_TIER3_LLM_MODEL_B:-}
    MESA_OLLAMA_URL: ${MESA_OLLAMA_URL:-http://host.docker.internal:11434}
    MESA_PORT: "8000"
    MESA_LOG_LEVEL: ${MESA_LOG_LEVEL:-INFO}
    MESA_LOG_FORMAT: ${MESA_LOG_FORMAT:-json}

services:
  mesa-v4:
    <<: *mesa-v4-runtime
    ports:
      - "127.0.0.1:${MESA_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "mesa_memory.container_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mesa-v4-data:
