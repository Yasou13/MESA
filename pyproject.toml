[tool.uv.workspace]
members = ["packages/mesa-memory", "packages/mesa-benchmark"]

[dependency-groups]
dev = [
    "cyclonedx-bom>=5.1.0",
    "mypy>=1.10.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/mesa-benchmark/tests"]
markers = [
    "optional_provider: requires an optional provider SDK; no real network calls",
    "optional_mcp: requires the optional MCP SDK; no real network calls",
    "live_external: requires an explicitly enabled external service",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"packages/mesa-memory/src/mesa_runtime/app.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_decorators = true

# ---- Progressive overrides for modules not yet remediated ----
[[tool.mypy.overrides]]
module = [
    "mesa_memory.consolidation.loop",
    "mesa_memory.consolidation.lock",
    "mesa_memory.consolidation.writer",
    "mesa_memory.consolidation.parser",
    "mesa_memory.consolidation.router",
    "mesa_memory.consolidation.validator",
    "mesa_memory.valence.*",
    "mesa_memory.observability.metrics",
    "mesa_memory.retrieval.*",
    "mesa_memory.adapter.*",
    "mesa_memory.extraction.*",
    "mesa_memory.security.rbac",
    "mesa_memory.api.server",
    "mesa_runtime.*",
    "mesa_api.router",
    "mesa_api.schemas",
    "mesa_storage.storage_kernel",
    "mesa_storage.schemas",
    "mesa_storage.kuzu_provider",
    "mesa_workers.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_untyped_decorators = false
warn_unused_ignores = false

# Pydantic's runtime validators are currently untyped in the supported
# dependency range.
[[tool.mypy.overrides]]
module = [
    "mesa_memory.config",
    "mesa_memory.consolidation.schemas",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "tests.bench.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = true
disable_error_code = [
    "method-assign",
    "arg-type",
    "attr-defined",
    "union-attr",
    "assignment",
    "override",
    "call-overload",
    "index",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = [
    "mesa_client.*",
    "mesa_mcp.*",
    "mesa_evals.*",
    "mesa_benchmark.*",
    "scripts.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false

[tool.coverage.run]
source = [
    "mesa_api",
    "mesa_client",
    "mesa_contracts",
    "mesa_memory",
    "mesa_runtime",
    "mesa_storage",
    "mesa_workers",
]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 82
show_missing = true
