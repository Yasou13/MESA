name: MESA CI

on:
  push:
    branches: [audit/production-readiness, benchmark/**, feature/mesa-law-readiness, loggin/**, main, mvp/**]
    tags: ["v*"]
  pull_request:
    branches: [audit/production-readiness, benchmark/**, feature/mesa-law-readiness, loggin/**, main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  MESA_RUNTIME_PROFILE: test-isolated
  MESA_LOAD_DOTENV: "false"
  MESA_MODEL_ENABLED: "false"
  MESA_EXTERNAL_PROVIDER_ENABLED: "false"
  MESA_API_KEY: ci-non-secret-placeholder
  MESA_PRINCIPAL_ID: ci-principal
  MESA_PRINCIPAL_STATUS: active

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail closed on tagged release metadata drift
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release_preflight.py --metadata-only "$GITHUB_REF_NAME"

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated runtime path
        run: echo "MESA_STORAGE_ROOT=$RUNNER_TEMP/mesa-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install "uv==0.13.1"
      - name: Install locked core and test dependencies
        run: uv sync --locked --extra dev
      - name: Dependency, compile, and import checks
        run: |
          uv pip check
          uv run python -m compileall -q mesa_memory mesa_storage mesa_workers mesa_api mesa_client
          uv run python -c "import mesa_memory, mesa_api, mesa_client, mesa_storage, mesa_workers"
      - name: Lint the repository
        run: uv run ruff check .
      - name: Enforce one-way production-layer imports
        run: uv run python scripts/check_layer_imports.py
      - name: Enforce formatting and progressive typing across production packages
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from black import FileMode, TargetVersion, WriteBack, format_file_in_place

          paths = [
              Path("mesa_memory/container_health.py"),
              Path("mesa_memory/runtime_entrypoint.py"),
          ]
          mode = FileMode(line_length=88, target_versions={TargetVersion.PY311})
          changed = [
              str(path)
              for path in paths
              if format_file_in_place(path, fast=False, mode=mode, write_back=WriteBack.CHECK)
          ]
          if changed:
              raise SystemExit("Black would reformat: " + ", ".join(changed))
          PY
          uv run python scripts/check_mypy_override_ratchet.py
          uv run mypy \
            mesa_memory mesa_storage mesa_workers mesa_api mesa_client \
            --ignore-missing-imports --explicit-package-bases --follow-imports=skip
      - name: Basic tracked-secret policy
        run: |
          test -z "$(git ls-files '.env' '*.pem' '*.key' '*.p12' '*.pfx')"
          ! git grep -IlE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!tests/**' ':!.env.example'

  secret-and-graph-assurance:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify the pinned TruffleHog scanner version
        run: docker run --rm ghcr.io/trufflesecurity/trufflehog:3.99.2 --version 2>&1 | grep -Fx "trufflehog 3.99.2"
      - name: Scan changed history for verified secrets
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          version: 3.99.2
          extra_args: --results=verified,unknown
      - name: Install security test dependencies
        run: |
          python -m pip install "uv==0.13.1"
          uv sync --locked --extra dev
      - name: Run isolation, recovery, and legal audit checks
        run: |
          set +e
          timeout 240s uv run python -m pytest -q tests/test_rbac_leak.py --tb=short \
            --junitxml=rbac-isolation.xml | tee rbac-isolation.log
          rbac_status=${PIPESTATUS[0]}
          timeout 240s uv run python -m pytest -q tests/test_chaos.py --tb=short \
            --junitxml=chaos-saga.xml | tee chaos-saga.log
          chaos_status=${PIPESTATUS[0]}
          timeout 240s uv run python -m pytest -q tests/test_legal_audit.py \
            --tb=short --junitxml=graph-assurance.xml | tee graph-assurance.log
          graph_status=${PIPESTATUS[0]}
          printf 'rbac_exit=%s\nchaos_exit=%s\ngraph_exit=%s\n' \
            "$rbac_status" "$chaos_status" "$graph_status" | tee security-assurance-summary.txt
          test "$rbac_status" -eq 0 -a "$chaos_status" -eq 0 -a "$graph_status" -eq 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-and-graph-assurance
          path: |
            rbac-isolation.log
            rbac-isolation.xml
            chaos-saga.log
            chaos-saga.xml
            graph-assurance.log
            graph-assurance.xml
            security-assurance-summary.txt
          if-no-files-found: warn
          retention-days: 10

  supply-chain-security:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Large image layers can exceed Trivy's five-minute default analysis budget.
      TRIVY_TIMEOUT: "10m"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install lockfile-resolved Python dependencies
        run: |
          python -m pip install "uv==0.13.1"
          uv sync --locked --extra dev
      - name: Build the shipped full-cognitive runtime image for scanning
        run: docker build --pull=false --tag mesa-memory:security --build-arg MESA_EXTRAS=ml,adapters --target runtime --file Dockerfile .
      - name: Fail on high or critical Python dependency findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Fail on high or critical full-cognitive image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: mesa-memory:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate the full-cognitive image CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: mesa-memory:security
          format: cyclonedx
          output: mesa-runtime-image.cdx.json
          exit-code: "0"
      - name: Generate a CycloneDX SBOM from locked dependencies and image inputs
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: supply-chain-sbom.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supply-chain-sbom
          path: |
            supply-chain-sbom.cdx.json
            mesa-runtime-image.cdx.json
          if-no-files-found: error
          retention-days: 30

  mcp-coverage:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev
      - name: Enforce the MCP service coverage floor
        run: >-
          uv run python -m pytest -q tests/test_mcp_v4_service.py
          --cov=mesa_mcp.v4_service --cov-fail-under=55
          --cov-report=term-missing --cov-report=xml:mcp-coverage.xml
          --cov-report=json:mcp-coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-coverage-report
          path: |
            mcp-coverage.xml
            mcp-coverage.json
          retention-days: 10

  zero-cost-contract:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MESA_ZERO_COST_MODE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated runtime path
        run: echo "MESA_STORAGE_ROOT=$RUNNER_TEMP/mesa-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev --extra adapters
      - run: uv pip check
      - name: Verify zero-cost provider selection and configuration parity
        run: >-
          uv run python -m pytest -q
          tests/test_config_edge_cases.py::test_config_zero_cost_mode
          tests/test_adapters.py::test_adapter_factory_auto_detect_zero_cost

  legacy-static-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev
      - name: Record full-tree Black and Mypy debt without masking it as a release gate
        run: |
          set +e
          uv run python - <<'PY' 2>&1 | tee legacy-black.log
          from pathlib import Path

          from black import FileMode, TargetVersion, WriteBack, format_file_in_place

          roots = [
              Path("mesa_memory"),
              Path("mesa_storage"),
              Path("mesa_workers"),
              Path("mesa_api"),
              Path("mesa_client"),
              Path("tests"),
          ]
          mode = FileMode(line_length=88, target_versions={TargetVersion.PY311})
          changed = [
              str(path)
              for root in roots
              for path in root.rglob("*.py")
              if format_file_in_place(path, fast=False, mode=mode, write_back=WriteBack.CHECK)
          ]
          if changed:
              print("Black would reformat:")
              print("\n".join(changed))
              raise SystemExit(1)
          print("Black check passed")
          PY
          black_status=${PIPESTATUS[0]}
          uv run python -m mypy mesa_memory mesa_storage mesa_workers mesa_api mesa_client \
            --ignore-missing-imports --explicit-package-bases \
            2>&1 | tee legacy-mypy.log
          mypy_status=${PIPESTATUS[0]}
          printf 'black_exit=%s\nmypy_exit=%s\n' "$black_status" "$mypy_status" \
            | tee legacy-static-summary.txt
          test "$black_status" -eq 0 -a "$mypy_status" -eq 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: legacy-static-baseline
          path: |
            legacy-black.log
            legacy-mypy.log
            legacy-static-summary.txt
          retention-days: 10

  core-tests:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated runtime path
        run: echo "MESA_STORAGE_ROOT=$RUNNER_TEMP/mesa-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev
      - run: uv pip check
      - name: Security, lifecycle, queue, and worker contracts
        run: >-
          uv run python -m pytest -q
          tests/test_v4_principal_authorization.py
          tests/test_v4_session_principal_route_isolation.py
          tests/test_v4_durable_dispatch_contract.py
          tests/test_v4_dispatch_completion_contract.py
          tests/test_purge_journal_contract.py
          tests/test_wal_claim_replay_contract.py
          tests/test_durable_dlq_contract.py
          tests/test_queue_admission_contract.py
          tests/test_v4_session_finalization_contract.py
          tests/test_runtime_profiles_contract.py

  v4-contract:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated V4 storage
        run: echo "MESA_STORAGE_ROOT=$RUNNER_TEMP/mesa-v4-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev
      - run: uv pip check
      - name: V4 API, SDK, ownership, projection and RRF contracts
        run: >-
          uv run python -m pytest -q --junitxml=v4-contract.xml
          tests/test_api_key_store.py
          tests/test_v4_admin_cli.py
          tests/test_v4_api_contract.py
          tests/test_v4_catalog_ownership.py
          tests/test_v4_ingestion_contract.py
          tests/test_v4_projection_integration.py
          tests/test_v4_rrf_ablation.py
          tests/test_v4_sdk_contract.py
          tests/test_operation_repository_contract.py
          tests/test_projection_generation_contract.py
          tests/test_rebuild_observability_contract.py
          tests/test_rebuild_runner_contract.py
          tests/test_async_client_auth_contract.py
          tests/test_mcp_api_boundary.py
      - name: Capture content-free V4 closure evidence
        if: always()
        run: >-
          uv run python -m scripts.capture_v4_closure_evidence
          --junit v4-contract.xml
          --output v4-closure-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v4-contract
          path: |
            v4-contract.xml
            v4-closure-evidence.json
          if-no-files-found: error
          retention-days: 10

  migration-dr:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MESA_REQUIRE_REAL_PROVIDER_REHEARSAL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated runtime path
        run: echo "MESA_STORAGE_ROOT=$RUNNER_TEMP/mesa-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev
      - run: uv pip check
      - name: Recovery, migration and rebuild contracts
        run: >-
          uv run python -m pytest -q --junitxml=migration-dr.xml
          tests/test_migration_closure.py
          tests/test_recovery_contract.py
          tests/test_v4_projection_integration.py
          tests/test_rebuild_preparation_contract.py
          tests/test_rebuild_replay_contract.py
          tests/test_rebuild_provider_rehearsal.py
      - name: Capture content-free migration and DR evidence
        if: always()
        run: >-
          uv run python -m scripts.capture_v4_closure_evidence
          --junit migration-dr.xml
          --output migration-dr-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-dr
          path: |
            migration-dr.xml
            migration-dr-evidence.json
          if-no-files-found: error
          retention-days: 10

  package:
    needs: [quality, release-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated runtime path
        run: echo "MESA_STORAGE_ROOT=$RUNNER_TEMP/mesa-storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev
      - name: Build reproducible wheels
        run: |
          SOURCE_DATE_EPOCH=0 uv build --wheel --out-dir dist/a .
          rm -rf build
          SOURCE_DATE_EPOCH=0 uv build --wheel --out-dir dist/b .
          sha256sum dist/a/*.whl dist/b/*.whl | tee dist/SHA256SUMS
          test "$(cut -d' ' -f1 dist/SHA256SUMS | sort -u | wc -l)" = 1
          ! python -m zipfile -l dist/a/mesa_memory-*.whl | grep -E '(__pycache__|\.pyc$)'
          python -m zipfile -l dist/a/mesa_memory-*.whl | grep -q 'mesa_storage/alembic/versions/'
      - name: Generate reproducible locked-runtime SBOM
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --no-hashes --output-file dist/runtime-requirements.txt
          uv run cyclonedx-py requirements --pyproject pyproject.toml --mc-type library --output-reproducible --of JSON --output-file dist/mesa-runtime.cdx.json dist/runtime-requirements.txt
      - name: Fresh wheel install and CLI smoke
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install -r dist/runtime-requirements.txt
          wheel-venv/bin/python -m pip install --no-deps dist/a/mesa_memory-*.whl
          wheel-venv/bin/python -m pip check
          wheel-venv/bin/python -c "from mesa_api import create_v4_router; from mesa_client import AsyncMesaV4Client, MesaV4Client; import mesa_memory, mesa_storage, mesa_workers"
          wheel-venv/bin/mesa-recovery --help
          wheel-venv/bin/mesa-v4-admin --help
      - name: Attest tagged package artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/a/*.whl
            dist/mesa-runtime.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: package-report
          path: dist/
          retention-days: 10

  coverage:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated runtime path
        run: |
          runtime_lab_root="$RUNNER_TEMP/mesa-lab"
          mkdir -p "$runtime_lab_root/storage"
          echo "MESA_RUNTIME_LAB_ROOT=$runtime_lab_root" >> "$GITHUB_ENV"
          echo "MESA_STORAGE_ROOT=$runtime_lab_root/storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev
      - run: uv pip check
      # P12-11b: measure the strict CPU budget in a fresh process, before the suite.
      - name: Isolated parser CPU budget (200 ms)
        run: >-
          uv run python -m pytest -q --no-cov
          tests/test_p1002_request_path_sweep.py::test_api_limit_parser_cpu_budget
      - name: Core and SDK coverage
        run: >-
          uv run python -m pytest -q --cov --cov-fail-under=82
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov --cov-report=json:coverage.json
          -m "not optional_provider and not optional_mcp and not live_external"
          --deselect=tests/test_p1002_request_path_sweep.py::test_api_limit_parser_cpu_budget
          --ignore=tests/go_live_proofs --ignore=tests/bench
      - name: SDK coverage collection contract
        run: uv run python -m pytest --collect-only -q tests/test_async_client_auth_contract.py tests/test_mcp_api_boundary.py
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 10

  optional-integrations:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure isolated runtime path
        run: |
          runtime_lab_root="$RUNNER_TEMP/mesa-lab"
          mkdir -p "$runtime_lab_root/storage"
          echo "MESA_RUNTIME_LAB_ROOT=$runtime_lab_root" >> "$GITHUB_ENV"
          echo "MESA_STORAGE_ROOT=$runtime_lab_root/storage" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "uv==0.13.1"
      - run: uv sync --locked --extra dev --extra adapters
      - run: uv pip check
      - name: Mocked optional provider and MCP integration boundaries
        run: >-
          uv run python -m pytest -q
          -m "(optional_provider or optional_mcp) and not live_external"

  windows-native:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install "uv==0.13.1"
      - name: Build wheel and verify native wheel install, mesa start, ingest, search, and mesa-mcp
        run: |
          uv build --wheel --out-dir dist .
          uv export --quiet --frozen --no-dev --no-emit-project --no-hashes --output-file dist/runtime-requirements.txt
          python - <<'PY'
          import json
          import os
          import socket
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request
          from pathlib import Path

          venv_dir = Path("wheel-venv").resolve()
          subprocess.run([sys.executable, "-m", "venv", str(venv_dir)], check=True)
          bin_dir = venv_dir / ("Scripts" if sys.platform == "win32" else "bin")
          py_bin = bin_dir / ("python.exe" if sys.platform == "win32" else "python")
          mesa_bin = bin_dir / ("mesa.exe" if sys.platform == "win32" else "mesa")
          mcp_bin = bin_dir / ("mesa-mcp.exe" if sys.platform == "win32" else "mesa-mcp")

          wheel = next(Path("dist").glob("mesa_memory-*.whl"))
          subprocess.run(
              [str(py_bin), "-m", "pip", "install", "--only-binary", ":all:", "-r", "dist/runtime-requirements.txt"],
              check=True,
          )
          subprocess.run([str(py_bin), "-m", "pip", "install", "--no-deps", str(wheel)], check=True)
          subprocess.run([str(py_bin), "-m", "pip", "check"], check=True)

          with tempfile.TemporaryDirectory(prefix="mesa-native-smoke-") as td:
              home = Path(td) / "home"
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                  s.bind(("127.0.0.1", 0))
                  port = s.getsockname()[1]

              clean_env = {k: v for k, v in os.environ.items() if not k.startswith("MESA_")}
              clean_env["MESA_HOME"] = str(home)
              clean_env["MESA_PORT"] = str(port)
              clean_env["MESA_MODEL_ENABLED"] = "false"
              clean_env["MESA_EXTERNAL_PROVIDER_ENABLED"] = "false"
              clean_env["PYTHONUTF8"] = "1"

              log_path = Path(td) / "server.log"
              with log_path.open("w", encoding="utf-8") as log_file:
                  server = subprocess.Popen(
                      [str(mesa_bin), "start", "--home", str(home), "--port", str(port)],
                      env=clean_env,
                      stdout=log_file,
                      stderr=subprocess.STDOUT,
                  )
              try:
                  deadline = time.monotonic() + 60
                  init_ok = False
                  while time.monotonic() < deadline:
                      if server.poll() is not None:
                          raise RuntimeError(
                              f"mesa start exited early ({server.returncode}):\n"
                              + log_path.read_text(encoding="utf-8", errors="replace")
                          )
                      try:
                          with urllib.request.urlopen(f"http://127.0.0.1:{port}/health/init", timeout=3) as r:
                              if r.status == 200:
                                  init_ok = True
                                  break
                      except Exception:
                          time.sleep(0.5)
                  assert init_ok, "timed out waiting for /health/init:\n" + log_path.read_text(encoding="utf-8", errors="replace")

                  creds = json.loads((home / "credentials.json").read_text(encoding="utf-8"))
                  req = urllib.request.Request(
                      f"http://127.0.0.1:{port}/health",
                      headers={"X-API-Key": creds["api_key"]},
                  )
                  with urllib.request.urlopen(req, timeout=5) as r:
                      health = json.loads(r.read().decode("utf-8"))
                  assert health.get("status") == "healthy", health

                  sample = Path(td) / "sample.txt"
                  sample.write_text("Tebligat Kanunu Madde 21 — İstanbul şubesi teslim kaydı.\n", encoding="utf-8")
                  subprocess.run([str(mesa_bin), "add", str(sample)], env=clean_env, check=True)
                  search = subprocess.run(
                      [str(mesa_bin), "search", "Tebligat", "--json"],
                      env=clean_env,
                      capture_output=True,
                      text=True,
                      encoding="utf-8",
                      check=True,
                  )
                  hits = json.loads(search.stdout)
                  assert hits and any("Tebligat" in (h.get("evidence_span") or h.get("content") or "") for h in hits), hits

                  mcp_cfg = subprocess.run(
                      [str(mesa_bin), "mcp", "config", "claude-desktop"],
                      env=clean_env,
                      capture_output=True,
                      text=True,
                      encoding="utf-8",
                      check=True,
                  )
                  parsed_cfg = json.loads(mcp_cfg.stdout)
                  assert Path(parsed_cfg["mcpServers"]["mesa"]["command"]).name.startswith("mesa-mcp")

                  mcp_proc = subprocess.Popen(
                      [str(mcp_bin)],
                      env=clean_env,
                      stdin=subprocess.PIPE,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                      encoding="utf-8",
                  )
                  try:
                      init_req = {
                          "jsonrpc": "2.0",
                          "id": 1,
                          "method": "initialize",
                          "params": {
                              "protocolVersion": "2024-11-05",
                              "capabilities": {},
                              "clientInfo": {"name": "ci-smoke", "version": "0.1"},
                          },
                      }
                      assert mcp_proc.stdin is not None and mcp_proc.stdout is not None
                      mcp_proc.stdin.write(json.dumps(init_req) + "\n")
                      mcp_proc.stdin.flush()
                      resp = json.loads(mcp_proc.stdout.readline())
                      assert resp.get("id") == 1 and "result" in resp, resp
                  finally:
                      mcp_proc.terminate()
                      mcp_proc.wait(timeout=10)
              finally:
                  server.terminate()
                  try:
                      server.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait(timeout=5)
          print("Native wheel smoke passed on", sys.platform)
          PY
      - name: Install locked dev environment
        run: uv sync --locked --extra dev
      - name: Run Windows native fast test subset
        run: >-
          uv run python -m pytest -q
          tests/test_single_writer_contract.py
          tests/test_recovery_contract.py
          tests/test_p403_local_cli.py
          tests/test_p1906_setup.py
          tests/test_p1801_session_optional.py
          tests/test_p1806_document_upload.py
          tests/test_p1902_ask.py
          tests/test_mcp_v4_service.py

